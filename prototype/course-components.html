<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveDispatch — Course Cards Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    .section { margin-bottom: 2rem; }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-width: 540px;
    }

    .course-card {
      position: relative;
      text-align: left;
      border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.625rem 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
      color: #e2e8f0;
    }

    .course-card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .course-card.selected {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }

    .course-card .check {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: none;
      font-size: 0.65rem;
    }
    .course-card.selected .check { display: block; }

    .course-card .name {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.3;
      padding-right: 1rem;
    }
    .course-card .agency {
      display: block;
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 0.2rem;
    }
    .course-card .days {
      display: block;
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 0.1rem;
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>Activity Type</h2>
    <div class="course-grid" id="course-grid"></div>
  </div>

  <script>
    const courses = [
      { code: 'DSD',       label: 'Discover Scuba Diving',  agency: 'PADI / SSI',  minDays: 1 },
      { code: 'TRY_DIVE',  label: 'Try Dive',               agency: 'PADI / SSI',  minDays: 1 },
      { code: 'OW',        label: 'Open Water Diver',        agency: 'PADI / SSI',  minDays: 3 },
      { code: 'AOW',       label: 'Advanced Open Water',     agency: 'PADI / SSI',  minDays: 2 },
      { code: 'RESCUE',    label: 'Rescue Diver',            agency: 'PADI / SSI',  minDays: 2 },
      { code: 'DM',        label: 'Divemaster',              agency: 'PADI / SSI',  minDays: 5 },
      { code: 'SPECIALTY', label: 'Specialty Course',        agency: 'PADI / SSI',  minDays: 1 },
      { code: 'FD',        label: 'Fun Dive',                agency: 'Agency-Free', minDays: 1 },
      { code: 'REFRESH',   label: 'Refresher / ReActivate', agency: 'Agency-Free', minDays: 1 },
    ]

    const grid = document.getElementById('course-grid')
    const selected = new Set()

    courses.forEach(({ code, label, agency, minDays }) => {
      const card = document.createElement('button')
      card.className = 'course-card'
      card.type = 'button'

      const check = document.createElement('span')
      check.className = 'check'
      check.textContent = '✓'

      const nameEl = document.createElement('span')
      nameEl.className = 'name'
      nameEl.textContent = label

      const agencyEl = document.createElement('span')
      agencyEl.className = 'agency'
      agencyEl.textContent = agency

      const daysEl = document.createElement('span')
      daysEl.className = 'days'
      daysEl.textContent = minDays + '+ day' + (minDays !== 1 ? 's' : '')

      card.appendChild(check)
      card.appendChild(nameEl)
      card.appendChild(agencyEl)
      card.appendChild(daysEl)

      card.addEventListener('click', () => {
        if (selected.has(code)) {
          selected.delete(code)
          card.classList.remove('selected')
        } else {
          selected.add(code)
          card.classList.add('selected')
        }
      })

      grid.appendChild(card)
    })
  </script>
</body>
</html>
