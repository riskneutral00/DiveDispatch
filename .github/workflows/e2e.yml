# Optional Playwright smoke against a running deployment (no Next.js build in CI).
# Set repository variable PLAYWRIGHT_BASE_URL (e.g. Vercel preview or staging).
# Clerk-authenticated tests stay manual — see e2e/smoke.spec.ts (E2E_CLERK_AUTH).

name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-public-smoke:
    if: vars.PLAYWRIGHT_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public smoke (non-Clerk)
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          E2E_SKIP_SEED_CHECK: '1'
        run: npx playwright test e2e/smoke.spec.ts --grep "smoke: public"
